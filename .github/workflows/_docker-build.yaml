name: BUILD

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a #v7.0.1

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 #v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1

      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        with:
          context: .
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: vscode:${{ github.sha }}
          cache-from: |
            type=gha
          cache-to: |
            mode=min,type=gha
          load: true

      - name: syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c #v0.24.3
        with: 
          image: vscode:${{ github.sha }}
          output-file: sbom.spdx.json
          format: spdx-json

      - name: GRYPE
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 #v7.4.2
        with: 
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: table
          only-fixed: true # only fail on things that have fix available
          
      - name: Smoke test
        env:
          IMAGE: vscode:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run -d --name testvsc -p 8080:8080 "${IMAGE}"

          if ! curl -fsS --retry 20 --retry-delay 3 --retry-connrefused http://localhost:8080/healthz; then
            echo "code-server did not become healthy"
            docker logs testvsc
            exit 1
          fi
